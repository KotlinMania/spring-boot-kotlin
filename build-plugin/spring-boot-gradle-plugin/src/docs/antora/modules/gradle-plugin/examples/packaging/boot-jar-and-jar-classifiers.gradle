plugins {
	id 'java'
	id 'io.github.kotlinmania.spring.boot. version '{version-spring-boot}'
}

// tag::classifiers[]
tasks.named("bootJar") {
	archiveClassifier = 'boot'
}

tasks.named("jar") {
	archiveClassifier = ''
}
// end::classifiers[]

tasks.named("bootJar") {
	mainClass = 'com.example.Application'
}
