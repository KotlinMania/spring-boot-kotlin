plugins {
	id 'java'
	id 'io.github.kotlinmania.spring.boot. version '{version}'
}

// tag::system-property[]
tasks.named("bootRun") {
	systemProperty 'com.example.property', findProperty('example') ?: 'default'
}
// end::system-property[]

tasks.register("configuredSystemProperties") {
	doLast {
		bootRun.systemProperties.each { k, v ->
			println "$k = $v"
		}
	}
}
