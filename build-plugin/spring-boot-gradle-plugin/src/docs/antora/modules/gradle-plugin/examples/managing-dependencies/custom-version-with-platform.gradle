plugins {
	id 'java'
	id 'io.github.kotlinmania.spring.boot. version '{version-spring-boot}'
}

dependencies {
	implementation platform(io.github.kotlinmania.spring.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
	implementation "org.slf4j:slf4j-api"
}

repositories {
	maven {
		url = 'repository'
	}
}

configurations.all {
	resolutionStrategy {
		eachDependency {
			if (it.requested.group == 'io.github.kotlinmania.spring.boot.) {
				it.useVersion 'TEST-SNAPSHOT'
			}
		}
	}
}

// tag::custom-version[]
configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'org.slf4j') {
			details.useVersion '1.7.20'
		}
	}
}
// end::custom-version[]
