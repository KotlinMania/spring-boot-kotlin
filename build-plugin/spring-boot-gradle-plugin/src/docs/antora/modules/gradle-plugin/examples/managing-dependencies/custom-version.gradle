plugins {
	id 'io.github.kotlinmania.spring.boot. version '{version-spring-boot}'
}

apply plugin: 'io.spring.dependency-management'

dependencyManagement {
	resolutionStrategy {
		eachDependency {
			if (it.requested.group == 'io.github.kotlinmania.spring.boot.) {
				it.useVersion 'TEST-SNAPSHOT'
			}
		}
	}
}

// tag::custom-version[]
ext['slf4j.version'] = '1.7.20'
// end::custom-version[]

repositories {
	maven {
		url = 'repository'
	}
}

tasks.register("slf4jVersion") {
	doLast {
		println dependencyManagement.managedVersions['org.slf4j:slf4j-api']
	}
}
